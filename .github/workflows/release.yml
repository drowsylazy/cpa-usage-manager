name: release
on:
  push:
    tags: ["v*"]
jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Test
        run: go test ./...
      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: gcc
        run: go build -buildmode=c-shared -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o cpa-usage-manager.so .
      - name: ABI smoke
        run: |
          gcc -O2 -Wall -Wextra -o /tmp/abi-smoke scripts/abi-smoke.c -ldl
          /tmp/abi-smoke ./cpa-usage-manager.so
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-usage-manager-linux-amd64
          path: cpa-usage-manager.so

  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "1"
          CC: aarch64-linux-gnu-gcc
        run: go build -buildmode=c-shared -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o cpa-usage-manager.so .
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-usage-manager-linux-arm64
          path: cpa-usage-manager.so

  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Install MinGW (winlibs portable)
        shell: pwsh
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-ucrt-r1/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r1.zip"
          $zip = Join-Path $env:RUNNER_TEMP "winlibs.zip"
          Invoke-WebRequest -UseBasicParsing $url -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Join-Path $env:RUNNER_TEMP "mingw64\bin"
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$bin`n")
          gcc --version
      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: gcc
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME
          if ($ver.StartsWith("v")) { $ver = $ver.Substring(1) }
          go build -buildmode=c-shared -trimpath -buildvcs=false -ldflags="-s -w -X main.version=$ver" -o cpa-usage-manager.dll .
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-usage-manager-windows-amd64
          path: cpa-usage-manager.dll

  darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Build
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "1"
          CC: clang
        run: go build -buildmode=c-shared -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o cpa-usage-manager.dylib .
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-usage-manager-darwin-arm64
          path: cpa-usage-manager.dylib