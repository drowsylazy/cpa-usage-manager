name: release
on:
  push:
    tags: ["v*"]
jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Test
        run: go test ./...
      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: gcc
        run: go build -buildmode=c-shared -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=${GITHUB_REF_NAME#v}" -o cpa-usage-manager.so .
      - name: ABI smoke
        run: |
          gcc -O2 -Wall -Wextra -o /tmp/abi-smoke scripts/abi-smoke.c -ldl
          /tmp/abi-smoke ./cpa-usage-manager.so
      - name: Package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          archive="cpa-usage-manager_${ver}_linux_amd64.zip"
          zip -9 -j "$archive" cpa-usage-manager.so
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-usage-manager-linux-amd64
          path: ${{ env.ARCHIVE }}

  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "1"
          CC: aarch64-linux-gnu-gcc
        run: go build -buildmode=c-shared -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=${GITHUB_REF_NAME#v}" -o cpa-usage-manager.so .
      - name: Package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          archive="cpa-usage-manager_${ver}_linux_arm64.zip"
          zip -9 -j "$archive" cpa-usage-manager.so
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-usage-manager-linux-arm64
          path: ${{ env.ARCHIVE }}

  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Install MinGW (winlibs portable)
        shell: pwsh
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-ucrt-r1/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r1.zip"
          $zip = Join-Path $env:RUNNER_TEMP "winlibs.zip"
          Invoke-WebRequest -UseBasicParsing $url -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Join-Path $env:RUNNER_TEMP "mingw64\bin"
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$bin`n")
          gcc --version
      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: gcc
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME
          if ($ver.StartsWith("v")) { $ver = $ver.Substring(1) }
          go build -buildmode=c-shared -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=$ver" -o cpa-usage-manager.dll .
      - name: Package
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME
          if ($ver.StartsWith("v")) { $ver = $ver.Substring(1) }
          $archive = "cpa-usage-manager_${ver}_windows_amd64.zip"
          # Compress-Archive 压缩档位不可控，改用 .NET ZipArchive 的 Optimal（Deflate 最高档）。
          Add-Type -AssemblyName System.IO.Compression
          $dll = Resolve-Path cpa-usage-manager.dll
          $fs = [IO.File]::Open((Join-Path (Get-Location) $archive), [IO.FileMode]::Create)
          $zip = New-Object IO.Compression.ZipArchive($fs, [IO.Compression.ZipArchiveMode]::Create)
          try {
            $entry = $zip.CreateEntry('cpa-usage-manager.dll', [IO.Compression.CompressionLevel]::Optimal)
            $entry.LastWriteTime = (Get-Item $dll).LastWriteTime
            $src = [IO.File]::OpenRead($dll)
            try { $dst = $entry.Open(); $src.CopyTo($dst); $dst.Dispose() } finally { $src.Dispose() }
          } finally { $zip.Dispose(); $fs.Dispose() }
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE=$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-usage-manager-windows-amd64
          path: ${{ env.ARCHIVE }}

  darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Build
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "1"
          CC: clang
        run: go build -buildmode=c-shared -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=${GITHUB_REF_NAME#v}" -o cpa-usage-manager.dylib .
      - name: Package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          archive="cpa-usage-manager_${ver}_darwin_arm64.zip"
          zip -9 -j "$archive" cpa-usage-manager.dylib
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-usage-manager-darwin-arm64
          path: ${{ env.ARCHIVE }}

  release:
    needs: [linux-amd64, linux-arm64, windows-amd64, darwin-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums.txt
        run: |
          cd dist
          sha256sum *.zip > checksums.txt
          cat checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true