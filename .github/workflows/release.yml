name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: so
          - goos: linux
            goarch: arm64
            ext: so
          - goos: windows
            goarch: amd64
            ext: dll
          - goos: darwin
            goarch: arm64
            ext: dylib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Test
        run: CGO_ENABLED=0 go test ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: go build -buildmode=c-shared -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "cpa-usage-manager.${{ matrix.ext }}" .
      - name: ABI smoke (linux amd64)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          gcc -O2 -Wall -Wextra -o /tmp/abi-smoke scripts/abi-smoke.c -ldl
          /tmp/abi-smoke ./cpa-usage-manager.so
