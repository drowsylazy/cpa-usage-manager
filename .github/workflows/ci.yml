name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未通过 gofmt："
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: node（拼接语法检查 + 前端单测）
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # console.js 已拆分为 internal/web/js/*.js，仓库不再有整份文件：
      # 语法检查跑在拼接产物上，行为断言见 scripts/js-tests.mjs。
      - run: |
          go run scripts/assemble-js.go > /tmp/console.assembled.js
          node --check /tmp/console.assembled.js
          node scripts/js-tests.mjs
      - name: test
        run: go test ./...
